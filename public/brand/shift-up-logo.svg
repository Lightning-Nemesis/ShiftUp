<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 0 324 96" role="img" aria-label="Shift Up">
  <!-- A white card behind the logo, so the dark lettering stays readable on a dark page. -->
  <rect x="-16" y="0" width="324" height="96" rx="18" fill="#ffffff"/>
  <rect x="8" y="16" width="64" height="64" rx="15" fill="#0f5e5a"/>
  <text x="17" y="63" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="40" fill="#fbf6ef">S</text>
  <text x="44" y="51" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" fill="#f7b9a8">u</text>
  <rect x="43" y="56" width="18" height="3.5" rx="1.75" fill="#f7b9a8"/>
  <!-- One line of text, so "Up" always sits just after "Shift" whatever font the viewer has. It stands a step higher, on its underline. -->
  <text x="92" y="64" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="46" fill="#1e2a32">Shift<tspan dx="12" dy="-10" fill="#c8432a" text-decoration="underline">Up</tspan></text>
</svg>
